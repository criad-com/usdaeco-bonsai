[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usdaeco-bonsai"
version = "0.1.5"
description = "Bonsai native sync host"
requires-python = ">=3.11"
dependencies = ["usdaeco-sync>=0.5,<0.6", "usdaeco-ifc>=0.1,<0.3"]

[project.scripts]
aeco-bonsai = "usdaeco_bonsai.cli:main"

[project.entry-points."aeco_sync.hosts"]
bonsai = "usdaeco_bonsai.host:BonsaiHost"

[tool.setuptools.packages.find]
where = ["tools"]
include = ["usdaeco_bonsai*"]

[tool.setuptools.package-data]
usdaeco_bonsai = ["scripts/*.csx", "scripts/*.json", "scripts/*.md", "gates/*.json"]

[tool.pytest.ini_options]
testpaths = ["testenv"]
markers = ["live: requires AECO_REVIT_ENDPOINT", "native: requires Blender and Bonsai"]
